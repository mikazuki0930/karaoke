<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10131b"><title>Vocal Studio</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="./style.css"></head><body><main><div class="row"><div><small>VOCAL STUDIO</small><h1>歌の練習</h1></div><span class="pill">スマホ版</span></div><section id="home"><h2>マイ楽曲</h2><div class="card"><label>曲名</label><input id="songName" type="text" placeholder="曲名を入力"><label>カラオケ音源（MP3 / WAV など）</label><input id="backingFile" type="file" accept="audio/*"><button id="pickFile" class="secondary">音源を選ぶ</button><p id="selectedFile">未選択</p><button id="addSong" class="large">＋ 曲を追加</button></div><div id="songs"></div></section><section id="detail" class="hidden"><button id="back" class="secondary">← 曲一覧</button><h2 id="currentTitle"></h2><div class="card"><small>カラオケ録音</small><p>イヤホンを接続してから録音してください。録音中はオケが再生されます。</p><div class="row"><button id="record" class="large">● 録音開始</button><button id="stop" class="danger hidden">■ 停止</button></div><p id="recordStatus" class="status"></p></div><div class="card"><h2>録音テイク</h2><div id="takes"></div></div><div id="mixer" class="card hidden"><div class="row"><h2>ミキサー</h2><span id="takeTitle" class="pill"></span></div><button id="play" class="large">▶ ミックス再生</button><button id="pause" class="secondary large" style="margin:8px 0 0">■ 停止</button><label>オケ音量 <span id="backingValue">75%</span></label><input id="backingVolume" type="range" min="0" max="100" value="75"><label>歌声音量 <span id="vocalValue">90%</span></label><input id="vocalVolume" type="range" min="0" max="100" value="90"><label><input id="reverbOn" type="checkbox" checked> 歌声リバーブ</label><label>リバーブ量 <span id="reverbValue">20%</span></label><input id="reverbAmount" type="range" min="0" max="100" value="20"><label>歌声のタイミング補正（ミリ秒） <span id="offsetValue">0</span></label><input id="offset" type="range" min="-500" max="500" step="10" value="0"><button id="export" class="large">↓ WAVで書き出す</button><p id="mixStatus" class="status"></p></div></section></main><script src="./app.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn))}</script></body></html>
