<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141d"><title>Vocal Studio</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"></head><body><main><header><div><small>VOCAL STUDIO</small><h1>歌の練習</h1></div><span class="pill">MINI DAW</span></header><section id="home"><h2>マイ楽曲</h2><div class="card"><label for="songName">曲名</label><input id="songName" type="text" placeholder="曲名を入力"><label>カラオケ音源（WAV / MP3 など）</label><input id="backingFile" type="file" accept=".wav,.wave,.mp3,.m4a,.aac,.ogg,.flac,audio/*"><button id="pickFile" class="secondary full">音源を選択</button><p id="selectedFile" class="sub">未選択</p><button id="addSong" class="full">＋ 曲を追加</button></div><div id="songs"></div></section><section id="detail" class="hidden"><button id="back" class="back secondary">← 曲一覧</button><div class="session-head"><div><small>VOCAL SESSION</small><h2 id="currentTitle"></h2></div><span id="recordBadge" class="pill">READY</span></div><div class="card daw"><div class="timeline-head"><strong id="positionLabel">0:00.0</strong><span id="durationLabel">/ 0:00.0</span></div><div id="timeline" class="timeline" aria-label="波形をタップして再生位置を移動"><canvas id="ruler" height="25"></canvas><div class="track"><div class="track-label backing">♫<small>オケ</small></div><canvas id="backWave" height="78"></canvas></div><div class="track"><div class="track-label vocal">♩<small>歌声</small></div><canvas id="voiceWave" height="78"></canvas></div><div id="playhead"></div></div><p class="hint">波形をタップ・ドラッグして再生位置を移動</p><div class="transport"><button id="rewind" class="secondary iconbtn" aria-label="先頭へ">⏮</button><button id="play" class="secondary iconbtn" aria-label="再生">▶</button><button id="record" class="recbtn" aria-label="録音開始">● REC</button><button id="stop" class="danger iconbtn hidden" aria-label="録音停止">■</button></div><p id="recordStatus" class="status">イヤホンを使用するとオケの回り込みを防げます</p></div><div class="card"><div class="row"><h3>MIXER</h3><span class="pill">2 TRACKS</span></div><div class="mixrow"><label for="backingVolume">オケ</label><input id="backingVolume" type="range" min="0" max="100" value="75"><output id="backingValue">75%</output></div><div class="mixrow"><label for="vocalVolume">歌声</label><input id="vocalVolume" type="range" min="0" max="100" value="90"><output id="vocalValue">90%</output></div><div class="mixrow"><label for="reverbAmount">Reverb</label><input id="reverbAmount" type="range" min="0" max="100" value="20"><output id="reverbValue">20%</output></div><label class="check"><input id="reverbOn" type="checkbox" checked> 歌声リバーブ ON</label><details><summary>詳細設定：歌声のタイミング補正</summary><label for="offset">補正（ms） <span id="offsetValue">0</span></label><input id="offset" type="range" min="-500" max="500" step="10" value="0"></details><button id="export" class="full secondary">↓ ミックスをWAVで書き出す</button><p id="mixStatus" class="status"></p></div><div class="card"><div class="row"><h3>録音テイク</h3><span id="takeTitle" class="pill">未選択</span></div><div id="takes"></div></div></section></main><script src="./app.js"></script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))</script></body></html>
